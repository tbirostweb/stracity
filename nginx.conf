# Les journaux n'enregistrent que le chemin ($uri), jamais la query string.
log_format stracity '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log /var/log/nginx/access.log stracity;

    # Site statique : lecture seule, aucun corps de requête accepté.
    client_max_body_size 1k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 15s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    include /etc/nginx/snippets/security-headers.conf;

    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # Les add_header d'une location remplacent ceux du serveur : le snippet est donc inclus partout.
    location = /healthz {
        access_log off;
        default_type text/plain;
        include /etc/nginx/snippets/security-headers.conf;
        return 200 "ok\n";
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Routes réelles de la SPA : 200 sur index.html.
    location ~ ^/(accueil|jeux|contact|mentions-legales|confidentialite|loading)/?$ {
        rewrite ^ /index.html last;
    }
    location = / { rewrite ^ /index.html last; }

    # Tout le reste : fichier statique existant, sinon vrai 404 (le SPA affiche la page « introuvable »).
    location / {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
    }

    error_page 404 /index.html;
}
